services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: hospital
      PGUSER: postgres
      PGPASSWORD: postgres
    depends_on:
      - db
    volumes:
      - .:/app
    working_dir: /app

  streamlit:
    build: .
    command: streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: hospital
      PGUSER: postgres
      PGPASSWORD: postgres
    depends_on:
      - db
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    working_dir: /app

volumes:
  pgdata:
